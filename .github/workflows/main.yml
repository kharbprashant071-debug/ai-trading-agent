name: AI Trading Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  trading-agent:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      # 3. Check repository files
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "Current directory:"
          pwd
          echo "===================================="

          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"
          echo "===================================="

          echo "Repository files:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
          echo "===================================="

          echo "Searching for requirements.txt..."

          REQ_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "requirements.txt" \
            -print -quit)

          if [ -z "$REQ_FILE" ]; then
            echo "ERROR: requirements.txt was NOT found."
            exit 1
          fi

          echo "Found requirements file:"
          echo "$REQ_FILE"

          echo "Checking Python files..."

          if [ ! -f "$GITHUB_WORKSPACE/wallet_monitor.py" ]; then
            echo "ERROR: wallet_monitor.py not found."
            exit 1
          fi

          if [ ! -f "$GITHUB_WORKSPACE/paper_trader.py" ]; then
            echo "ERROR: paper_trader.py not found."
            exit 1
          fi

          if [ ! -f "$GITHUB_WORKSPACE/config.py" ]; then
            echo "ERROR: config.py not found."
            exit 1
          fi

          echo "All required files found."

      # 4. Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          REQ_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "requirements.txt" \
            -print -quit)

          echo "Installing from:"
          echo "$REQ_FILE"

          python -m pip install -r "$REQ_FILE"

      # 5. Run wallet monitor
      - name: Run wallet monitor
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "Running wallet monitor..."
          python wallet_monitor.py

      # 6. Run paper trader
      - name: Run paper trader
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "Running paper trader..."
          python paper_trader.py

      # 7. Finish
      - name: Complete
        shell: bash
        run: |
          echo "===================================="
          echo "AI Trading Agent completed."
          echo "===================================="
