name: AI Trading Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  trading-agent:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CURRENT DIRECTORY"
          echo "======================================"

          pwd
          echo ""

          echo "======================================"
          echo "REPOSITORY FILES"
          echo "======================================"

          ls -la

          echo ""

          echo "======================================"
          echo "CHECKING REQUIRED FILES"
          echo "======================================"

          test -f "$GITHUB_WORKSPACE/requirements.txt"
          test -f "$GITHUB_WORKSPACE/wallet_monitor.py"
          test -f "$GITHUB_WORKSPACE/paper_trader.py"
          test -f "$GITHUB_WORKSPACE/config.py"

          echo "requirements.txt FOUND"
          echo "wallet_monitor.py FOUND"
          echo "paper_trader.py FOUND"
          echo "config.py FOUND"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          python -m pip install \
            -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Run wallet monitor
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "Starting wallet monitor..."
          python wallet_monitor.py

      - name: Run paper trader
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "Starting paper trader..."
          python paper_trader.py

      - name: Complete
        shell: bash
        run: |
          echo "======================================"
          echo "AI TRADING AGENT COMPLETED"
          echo "======================================"
