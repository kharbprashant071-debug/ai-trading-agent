name: AI Trading Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  trading-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Git tracked files:"
          git ls-files

          echo "Requirements file from Git:"
          git show HEAD:requirements.txt

      - name: Install dependencies
        run: |
          set -e

          git show HEAD:requirements.txt > /tmp/requirements.txt

          echo "Installing:"
          cat /tmp/requirements.txt

          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements.txt

      - name: Run wallet monitor
        run: |
          python wallet_monitor.py

      - name: Run paper trader
        run: |
          python paper_trader.py

      - name: Complete
        run: |
          echo "AI TRADING AGENT COMPLETED"
